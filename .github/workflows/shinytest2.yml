name: shinytest2

on:
  push:
    branches: [devel, modernize]
  pull_request:
    branches: [devel]

jobs:
  shinytest2:
    runs-on: ubuntu-latest
    name: Linux state-based UI tests

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Bioconductor
        run: |
          install.packages("BiocManager")
          BiocManager::install(ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::shinytest2
            any::chromote
          needs: check

      - name: Install package
        run: R CMD INSTALL .

      - name: Run shinytest2 suite
        run: |
          testthat::test_file(
            "tests/testthat/test-app-shinytest2.R",
            reporter = testthat::default_reporter()
          )
        shell: Rscript {0}

      - name: Upload shinytest2 artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shinytest2-debug
          path: |
            tests/testthat/_snaps/
            **/*.png
            **/*.log
          if-no-files-found: ignore
